# =====================================================================
# Student Profile & Skill Development Management System Configuration
# =====================================================================

spring.application.name=student-management
server.port=8080

# Default datasource configured for MySQL:
spring.datasource.url=jdbc:mysql://localhost:3306/student_mgmt_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
# Change this password to match your local MySQL root password:
spring.datasource.password=apurve12345
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration (Hibernate automatically detects the MySQL dialect)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
